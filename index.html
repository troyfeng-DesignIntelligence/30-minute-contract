<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>洪流骑手</title>
</head>
<body>
  <p>正在进入骑手模拟器……</p>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (!params.has("mode")) params.set("mode", "experiment");
      if (!params.has("mechanism")) params.set("mechanism", "k-u-unified-v1.2");
      if (!params.has("seed")) {
        const values = new Uint32Array(1);
        if (globalThis.crypto?.getRandomValues) {
          globalThis.crypto.getRandomValues(values);
        } else {
          values[0] = Math.floor(Math.random() * 0xffffffff);
        }
        params.set("seed", String(values[0] || 4081));
      }
      if (!params.has("pid")) {
        const suffix = Math.random().toString(36).slice(2, 8).toUpperCase();
        params.set("pid", `SHARE-${Date.now().toString(36).toUpperCase()}-${suffix}`);
      }
      if (!params.has("build")) params.set("build", "pomdp-k-u-unified-candidate-v1.2-copy-review-r3");
      location.replace(`./pomdp-v2.html?${params.toString()}`);
    })();
  </script>
</body>
</html>
